# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR TECHSOLUTIONOR HOSTCONTROL
# Domains:
#   1. tpanel.techsolutionor.com          -> User Panel & Dashboard
#   2. mail.techsolutionor.com            -> Dedicated Webmail Portal
#   3. superadminpane.techsolutionor.com  -> Super Admin Console
# ==============================================================================

# Upstream definitions
upstream nextjs_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream express_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. USER PANEL: tpanel.techsolutionor.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name tpanel.techsolutionor.com;

    client_max_body_size 50M;

    # API Proxy to Express Backend
    location /api/ {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Next.js Proxy
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. DEDICATED WEBMAIL: mail.techsolutionor.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name mail.techsolutionor.com webmail.techsolutionor.com;

    client_max_body_size 50M;

    # API Proxy to Express Backend
    location /api/ {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Next.js Proxy (Middleware automatically rewrites to /webmail)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. SUPER ADMIN PANEL: superadminpane.techsolutionor.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name superadminpane.techsolutionor.com superadminpanel.techsolutionor.com;

    client_max_body_size 50M;

    # API Proxy to Express Backend
    location /api/ {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Next.js Proxy (Middleware automatically rewrites to /admin)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
